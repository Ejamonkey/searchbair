name: SignalWorks installable Fabric JAR
on:
  push:
    branches: [signalworks-ci-staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-installable:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Decode and verify source
        shell: bash
        run: |
          cat ci_source/chunk_*.b64 | base64 -d > /tmp/signalworks.zip
          echo 'c49481d2f2e81a334b0549bc5d0428dd24911daa41a32fcb2cf6bb4ab38b8eee  /tmp/signalworks.zip' | sha256sum -c -
          unzip -q /tmp/signalworks.zip
          mv BairSignalWorks-26.3-v0.5.0-alpha.2 project
      - name: Pure Java regression tests
        run: cd project && bash scripts/test-core.sh
      - name: Validate resources
        run: cd project && python3 scripts/validate_package.py
      - name: Compile and remap final Fabric JAR
        run: cd project && gradle --no-daemon build -x test
      - name: Verify final JAR metadata
        shell: bash
        run: |
          ls -lah project/build/libs
          python3 - <<'PY'
          import zipfile,glob,json
          jars=[j for j in glob.glob('project/build/libs/*.jar') if '-sources' not in j]
          assert jars, 'No installable jars!'
          for j in jars:
            with zipfile.ZipFile(j) as z:
              names=z.namelist()
              assert 'fabric.mod.json' in names,(j, 'no mod metadata')
              meta=json.loads(z.read('fabric.mod.json'))
              assert meta.get('id')=='bairsignalworks',meta
              print('VERIFY:',j,'size:',len(open(j,'rb').read()),'entries:',len(names),'mod:',meta.get('id'),'version:',meta.get('version'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BairSignalWorks-26.3-Installable-JAR
          path: |
            project/build/libs/*.jar
            !project/build/libs/*-sources.jar
          if-no-files-found: error
