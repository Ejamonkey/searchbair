name: Build SignalWorks actual Minecraft JAR
on:
  push:
    branches: [signalworks-ci-staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Decode the source archive
        shell: bash
        run: |
          cat ci_source/chunk_*.b64 | base64 -d > /tmp/source.zip
          echo 'c49481d2f2e81a334b0549bc5d0428dd24911daa41a32fcb2cf6bb4ab38b8eee  /tmp/source.zip' | sha256sum -c -
          mkdir /tmp/signalworks
          unzip -q /tmp/source.zip -d /tmp/signalworks
          mv /tmp/signalworks/BairSignalWorks-26.3-v0.5.0-alpha.2 ./project
      - name: Check resources
        run: cd project && python3 scripts/validate_package.py
      - name: Compile and package mod
        run: cd project && gradle --no-daemon --stacktrace build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signalworks-build-result
          path: project/build/libs/*.jar
          if-no-files-found: warn
