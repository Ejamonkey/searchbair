name: SignalWorks Fabric 26.3 Compile
on:
  push:
    branches: [signalworks-ci-staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Extract sources
        shell: bash
        run: |
          cat ci_source/chunk_*.b64 | base64 -d > /tmp/src.zip
          mkdir project-tmp
          unzip -q /tmp/src.zip -d project-tmp
          mv project-tmp/BairSignalWorks-26.3-v0.5.0-alpha.2 project
      - name: Build
        run: cd project && gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SignalWorks-Fabric-jar
          path: project/build/libs/*.jar
